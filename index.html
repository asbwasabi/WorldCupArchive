<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Archive - Goal Videos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>⚽ WCA</h1>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-year="2022">2022 Qatar</button>
                <button class="nav-item" data-year="2026">2026 USA/Canada</button>
            </nav>
            <div class="sidebar-footer">
                <p>World Cup Archive</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div class="header-info">
                    <h2 id="year-title">2022 FIFA World Cup Qatar</h2>
                    <p id="year-subtitle">Goal Videos Collection</p>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-wrapper">
                <!-- Group Stage Section -->
                <section class="stage-section" id="section-groupstage">
                    <div class="section-header">
                        <h3>Group Stage</h3>
                        <span class="video-count" id="count-groupstage">0</span>
                    </div>
                    <div class="videos-grid" id="groupstage-2022">
                        <!-- Video tiles will be inserted here -->
                    </div>
                </section>

                <!-- Early Knockouts Section -->
                <section class="stage-section" id="section-earlyknockouts">
                    <div class="section-header">
                        <h3>Early Knockouts</h3>
                        <span class="video-count" id="count-earlyknockouts">0</span>
                    </div>
                    <div class="videos-grid" id="early-knockouts-2022">
                        <!-- Video tiles will be inserted here -->
                    </div>
                </section>

                <!-- Late Knockouts Section -->
                <section class="stage-section" id="section-lateknockouts">
                    <div class="section-header">
                        <h3>Late Knockouts</h3>
                        <span class="video-count" id="count-lateknockouts">0</span>
                    </div>
                    <div class="videos-grid" id="late-knockouts-2022">
                        <!-- Video tiles will be inserted here -->
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
